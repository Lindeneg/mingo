does = "the checks of every pull request in .github/workflows/ci.yml, one job per check, and the setup action of the project's stack"

[[asks]]
key = "ci.stack"
question = "how CI installs the project"
default = "pnpm"
choices = [
    { value = "pnpm", hint = "installs with pnpm, and each check runs pnpm <check>" },
    { value = "npm", hint = "installs with npm, and each check runs npm run <check>" },
    { value = "go", hint = "sets up Go, and you name each check's command" },
    { value = "other", hint = "you name the setup, each check's command and the audit" },
]

[[asks]]
key = "ci.setup"
question = "the commands CI runs to set up the project before each check, empty for none"
list = true
default = ""
when = "ci.stack=other"

[[asks]]
key = "workflow.checks"
question = "the CI jobs every pull request must pass, such as test or build"
list = true
default = "check, test, build, security"

[[asks]]
key = "ci.run"
question = "the command of the check {item}"
each = "check"
when = "ci.stack=go|other"

[[asks]]
key = "ci.audit"
question = "the dependency audit the security job runs, empty for none"
default = ""
when = "ci.stack=other"
