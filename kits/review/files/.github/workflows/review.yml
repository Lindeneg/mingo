[[block "header" .]]# The Claude review of every pull request, on open and on every push. Each run
# posts one comment that begins with `[[.Workflow.ReviewLine]] <head sha>` and a verdict line
# mingo pr merge reads: `[[.Workflow.NoFindings]]`, or `findings: N`; no such comment on the
# current head means not reviewed. Without the token the job says so in a warning
# and passes, and the review runs locally, recorded on the pull request under the
# `ci-unavailable` label.
[[end]]name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: The token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning title=review did not run::CLAUDE_CODE_OAUTH_TOKEN is not set for this run; the review runs locally instead[[block "local" .]][[end]]"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
[[block "bots" .]][[end]]          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            You are the pull request review of [[indent 12 .Title]]. Read [[indent 12 .Review.Read]]. The pull request branch is checked out in the working directory; `gh pr diff` shows the change.

            Report must-fix and should-fix findings only, in this order: [[indent 12 (semis .Review.Categories)]]. Do not report [[indent 12 .Review.Skip]]: tools check those. Do not praise and do not summarise the change.

            Post exactly one top-level comment with `gh pr comment`, beginning with the line `[[indent 12 .Workflow.ReviewLine]] ${{ github.event.pull_request.head.sha }}` and then the line `[[indent 12 .Workflow.NoFindings]]` when nothing must change, else the line `findings: N` followed by one bullet per finding: `[must-fix | should-fix] <file>:<line>: <what fails and with which input or state>. Fix: <one sentence>.` Use inline comments (mcp__github_inline_comment__create_inline_comment with confirmed: true) for the findings that point at a line. Post nothing else.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
