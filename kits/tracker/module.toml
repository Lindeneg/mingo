checks = ["labels", "linear"]

[[asks]]
key = "tracker.kind"
question = "the tracker: linear, github or none"
default = "github"

[[asks]]
key = "tracker.team"
question = "the Linear team's key"
when = "tracker.kind=linear"

[[asks]]
key = "tracker.project"
question = "the Linear project"
default = "{title}"
when = "tracker.kind=linear"
